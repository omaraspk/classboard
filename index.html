<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
:root{
  --bg:#f4f1ea; --panel:#fff; --ink:#1f2a2e; --muted:#6b7478; --line:#e2ddd2;
  --accent:#2f6f62; --accent-ink:#fff; --danger:#b3412f; --shadow:0 8px 28px rgba(20,30,30,.14);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:14px}
.hidden{display:none!important}
header.top{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header.top h1{font-size:20px;margin:0;flex:1}
header.top h1 span{color:var(--accent)}
main{padding:20px;max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.card .thumb{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-weight:700;padding:10px;text-align:center;cursor:pointer}
.card .meta{padding:10px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .meta b{flex:1 1 100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta small{color:var(--muted);flex:1}
.empty{color:var(--muted);padding:40px;text-align:center;border:2px dashed var(--line);border-radius:var(--radius)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
h2{font-size:17px;margin:24px 0 10px}

/* editor: tools (left) · toolbar, slide, link bar (middle) · slides (right) */
#topActions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.deckName{border:1px solid transparent;border-radius:8px;padding:6px 10px;font-weight:700;width:220px;background:transparent}
.deckName:hover,.deckName:focus{border-color:var(--line);background:#fff}
.saveState{color:var(--muted);font-size:14px;margin-right:6px;white-space:nowrap}
#editor{display:grid;grid-template-columns:min(280px,70vw) minmax(0,1fr) 210px;height:calc(100vh - 57px)}
#editor.noLeft{grid-template-columns:0 minmax(0,1fr) 210px}
#editor.noLeft #edLeft,#editor:not(.noLeft) #edLeftShow{display:none}
#edLeft{border-right:1px solid var(--line);background:#f3efe6;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#edLeft>.hint{padding:0 12px;margin:0 0 8px}
#edDockHost{flex:1;min-height:0;display:flex;flex-direction:column}
#edMain{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;padding:12px 16px;gap:10px}
.edBar{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:5px 8px;flex-wrap:wrap}
.edBar .tbtn{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 9px;border-radius:9px;font-weight:600;font-size:15px}
.edBar .tbtn:hover,.edBar .iconBtn:hover{background:#f0ede6}
.edBar .tbtn .i{width:24px;height:24px;border-radius:7px;background:#e3efea;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.edBar .sep{width:1px;align-self:stretch;background:var(--line);margin:4px 6px}
.edBar .iconBtn{border:0;background:none;min-width:34px;height:34px;border-radius:9px;font-size:15px}
.edBar .hint{margin:0 4px}
#selBar{display:none;gap:5px}
#selBar.show{display:flex}
.titleRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.titleRow label{font-size:14px;color:var(--muted)}
.titleRow input{flex:0 1 420px;min-width:160px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:#fff}
#canvasWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#canvasWrap .stage{box-shadow:var(--shadow)}
.edHint{text-align:center;font-size:13px;color:var(--muted);margin:0}
.linkCard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px}
.linkRow{display:flex;align-items:center;gap:8px;background:#f5f3ee;border-radius:12px;padding:4px 4px 4px 12px}
.linkRow input{border:0;background:transparent;padding:8px 4px;outline:none;min-width:0}
#linkUrl{flex:1}
#linkTitle{width:160px;border-left:1px solid var(--line);padding-left:12px}
.linkActions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.linkActions .tip{margin-left:auto;font-size:12px;color:var(--muted)}
.pill{border:0;background:#efece4;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.pill:hover{background:#e3dfd3}
.pill.primary{background:var(--accent);color:#fff}
#edRight{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#edRight .adds{padding:10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.dashBtn{border:1.5px dashed #cfc8b8;background:none;border-radius:10px;padding:10px;font-weight:600}
.dashBtn:hover{border-color:var(--accent);color:var(--accent)}
#slideList{flex:1;overflow:auto;padding:10px}
.sItem{display:flex;gap:6px;align-items:flex-start;margin-bottom:10px;cursor:pointer}
.sItem .n{width:22px;height:22px;flex:none;border-radius:50%;background:#e8e4da;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:3px}
.sItem.on .n{background:var(--accent);color:#fff}
.sItem .sw{flex:1;min-width:0}
.sItem .sbox{border:2px solid transparent;border-radius:9px;position:relative}
.sItem.on .sbox{border-color:var(--accent)}
.sItem .sDel{position:absolute;top:3px;right:3px;z-index:4;border:0;background:#fffe;border-radius:6px;width:22px;height:22px;font-size:12px;display:none;padding:0}
.sItem:hover .sDel{display:block}
.sItem .lbl{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.pop{position:absolute;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;width:300px;max-width:calc(100% - 20px)}
.pop h4{margin:10px 0 6px;font-size:13px;color:var(--muted)}
.pop h4:first-child{margin-top:0}
.shapeGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.shapeGrid button{height:54px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center}
.shapeGrid button i{display:block;width:32px;height:26px;background:var(--accent)}
#drop{position:fixed;inset:10px;z-index:150;background:rgba(47,111,98,.14);border:4px dashed var(--accent);border-radius:18px;display:none;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--accent);pointer-events:none}
#drop.show{display:flex}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatches button{width:30px;height:30px;border-radius:8px;border:2px solid var(--line)}
.swatches button.on{border-color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:6px 0}
.err{color:var(--danger);font-size:13px}

/* slide stage */
.stage{position:relative;aspect-ratio:16/9;width:100%;border-radius:10px;overflow:hidden;container-type:inline-size;background:#fff}
.stage .content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:6cqw 7cqw;gap:2.4cqw}
.stage h2.st{margin:0;font-size:6.2cqw;line-height:1.1}
.stage .sb{font-size:3cqw;white-space:pre-wrap}
.stage .sb ul{margin:0;padding-left:1.2em}
.stage.layout-title .content{text-align:center;align-items:center}
.stage.layout-title h2.st{font-size:8cqw}
.stage iframe,.stage img.full{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.stage img.full{object-fit:contain}
.stage .cap{position:absolute;left:0;right:0;bottom:0;padding:1.2cqw 2cqw;font-size:2.4cqw;background:rgba(0,0,0,.55);color:#fff}
.stage .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1cqw;color:#fff;background:#333;font-size:2.6cqw;text-align:center;padding:4cqw}
.stage .ph b{font-size:3.6cqw}
.thumbStage .stage{border-radius:6px}
.stage video.full{position:absolute;inset:0;width:100%;height:100%;background:#000}
.stage .sb[contenteditable]{outline:none;min-height:1.4em;cursor:text}
.stage .sb[contenteditable]:empty::before{content:"Click to type";opacity:.4}
/* things placed on a slide: text boxes, shapes, sticky notes, pictures */
.items{position:absolute;inset:0;z-index:3;pointer-events:none}
.item{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;word-break:break-word}
.item .tx{width:100%;max-height:100%;overflow:hidden;outline:none;white-space:pre-wrap}
.item.k-text{justify-content:flex-start;text-align:left}
.item.k-sticky{box-shadow:0 .4cqw 1.2cqw rgba(0,0,0,.2);padding:1.2cqw;align-items:flex-start}
.item.k-shape{padding:1cqw}
.item.k-image img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}
.items.edit .item{pointer-events:auto;cursor:move;touch-action:none}
.items.edit .item.sel{outline:.22cqw solid #2a6db0;outline-offset:.2cqw}
.items.edit .item .hd{display:none;position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;background:#fff;border:2px solid #2a6db0;border-radius:4px;cursor:nwse-resize}
.items.edit .item.sel .hd{display:block}
.items.edit .item.editing{cursor:text}
.items.edit .item.editing .tx{outline:1px dashed #2a6db0}

/* present: tool dock on the left, slide in the middle, drawing bar + slide controls at the bottom */
#present{position:fixed;inset:0;background:#101415;z-index:50;display:grid;grid-template-columns:min(340px,80vw) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
#present.noSide,#present.noMenus{grid-template-columns:0 minmax(0,1fr)}
#present.noSide #pSide,#present.noMenus #pSide,#present.noMenus #pBottom{display:none}
#pSide{grid-column:1;grid-row:1/3;background:#f3efe6;border-right:1px solid #0003;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.sideHead{display:flex;align-items:center;gap:6px;padding:10px 12px}
.sideHead b{flex:1;font-size:17px}
#dock{flex:1;min-height:0;overflow:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:10px}
.dockEmpty{color:var(--muted);text-align:center;border:2px dashed var(--line);border-radius:12px;padding:24px 12px;font-size:14px}
#pSlidesHead{display:flex;align-items:center;gap:6px;padding:8px 12px;border-top:1px solid var(--line)}
#pSlidesHead small{color:var(--muted)}
#pThumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px 10px;max-height:28vh;overflow:auto}
#pThumbs.closed{display:none}
.pThumb{border:3px solid transparent;border-radius:9px;cursor:pointer;position:relative}
.pThumb.on{border-color:var(--accent)}
.pThumb .n{position:absolute;left:4px;top:3px;z-index:1;background:#fffd;border-radius:5px;padding:0 5px;font-size:11px;font-weight:700}
#pMain{grid-column:2;grid-row:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
#pBox{position:relative;width:100%}
#pBox .stage{border-radius:4px}
#ink{position:absolute;inset:0;width:100%;height:100%;z-index:5;touch-action:none;cursor:crosshair}
#ink.off{pointer-events:none}
#spot{position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(circle var(--r,170px) at var(--x,50%) var(--y,50%),transparent 97%,rgba(0,0,0,.86) 100%)}
#pTopRight{position:absolute;top:10px;right:10px;z-index:20;display:flex;gap:6px}
.darkBtn{background:#1f2629;color:#fff;border:1px solid #fff3;border-radius:999px;padding:6px 14px;font-weight:600}
.darkBtn:hover{background:#2d373b}
#sideShow{position:absolute;left:10px;top:10px;z-index:20}
#menusShow{position:absolute;left:10px;bottom:10px;z-index:20}
#present:not(.noSide) #sideShow,#present.noMenus #sideShow,#present:not(.noMenus) #menusShow{display:none}
#pBottom{grid-column:2;grid-row:2;display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
.inkBar{display:flex;gap:2px;background:#fff;border-radius:14px;padding:5px;flex-wrap:wrap}
.inkBar button{display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:5px 8px;border-radius:10px;font-size:12px;color:#333;min-width:56px}
.inkBar button .i{font-size:18px;line-height:1.1}
.inkBar button:hover{background:#f0ede6}
.inkBar button.on{background:var(--accent);color:#fff}
.inkColors{display:flex;gap:6px;background:#fff;border-radius:14px;padding:8px 10px}
.inkColors button{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0003}
.inkColors button.on{box-shadow:0 0 0 3px var(--ink)}
.inkSizes{display:flex;gap:2px;align-items:center;background:#fff;border-radius:14px;padding:4px 6px}
.inkSizes button{width:30px;height:30px;border:0;border-radius:9px;background:none;display:flex;align-items:center;justify-content:center;padding:0}
.inkSizes button:hover{background:#f0ede6}
.inkSizes button.on{background:#e3efea;box-shadow:inset 0 0 0 2px var(--accent)}
.inkSizes button i{display:block;border-radius:50%;background:#333}
.navBar{margin-left:auto;display:flex;align-items:center;gap:4px;background:#1f2629;border-radius:12px;padding:5px;color:#fff}
.navBar button{background:#2d373b;border:0;color:#fff;border-radius:8px;padding:8px 12px;font-weight:600}
.navBar button:hover{background:#3b484d}
#pNum{padding:0 10px;font-weight:700;font-variant-numeric:tabular-nums}
#fx{position:fixed;inset:0;z-index:90;pointer-events:none}

/* tool cards: docked in the side panel, or floating anywhere */
.tool{background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);display:flex;flex-direction:column;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.tool.floating{position:fixed;z-index:70;width:340px;max-width:calc(100vw - 20px);box-shadow:var(--shadow)}
.tool .th{display:flex;align-items:center;gap:4px;padding:7px 8px 7px 12px;background:var(--accent);color:#fff;border-radius:var(--radius) var(--radius) 0 0;user-select:none;touch-action:none}
.tool.floating .th{cursor:move}
.tool.min .th{border-radius:var(--radius)}
.tool .th b{flex:1;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tool .th button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:7px;width:26px;height:26px;font-size:13px;padding:0}
.tool .th button:hover{background:rgba(255,255,255,.32)}
.tool .tb{padding:12px;overflow:auto}
.tool.min .tb{display:none}
.chip{border:0;background:#efece4;border-radius:999px;padding:5px 10px;font-size:14px;font-weight:600}
.chip:hover{background:#e3dfd3}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0003;padding:0}
.dot.on{box-shadow:0 0 0 3px var(--ink)}
.dial{width:170px;height:170px;border-radius:50%;margin:2px auto 0;background:#efece4;padding:9px;position:relative}
.dial .pie{width:100%;height:100%;border-radius:50%}
.dial i{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0004}
.vcard{border-radius:14px;color:#fff;text-align:center;padding:14px;cursor:pointer;user-select:none;transition:background .2s}
.vcard b{font-size:60px;display:block;line-height:1}
.vcard span{display:block;font-size:24px;font-weight:800}
.vcard small{display:block;opacity:.9;font-size:14px}
.vrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.vrow button{border:0;border-radius:10px;padding:8px 0;font-weight:800;color:#fff;font-size:18px}
.vrow button.on{outline:3px solid var(--ink);outline-offset:1px}
.tb input.full,.tb textarea.full,.tb select.full{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:#fff}
.tb textarea.full{min-height:70px;resize:vertical}
.tb .lab{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
.jar{width:160px;display:block;margin:0 auto}
.jar circle{transition:opacity .3s}
.capBox{background:#111;color:#fff;border-radius:12px;padding:12px 14px;height:230px;overflow:auto;font-size:calc(22px * var(--s,1));line-height:1.3;margin-top:8px}
.capBox .ln{margin:0 0 8px}
.capBox .tr{color:#ffd76a;display:block}
.capBox .im{opacity:.55}
.capBox .ph{opacity:.6;font-size:16px}
.tgt{border-radius:14px;padding:14px;background:#f3f8f6;border:2px solid var(--accent)}
.tgt .subj{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.tgt .ican{font-size:24px;font-weight:800;margin:8px 0;line-height:1.2}
.tgt ul{margin:0;padding:0;list-style:none}
.tgt li{padding:4px 0 4px 26px;position:relative;font-size:17px}
.tgt li::before{content:"✓";position:absolute;left:4px;color:var(--accent);font-weight:800}
.bbCard{border-radius:14px;padding:18px 14px;text-align:center;color:#fff;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.bbCard .em{font-size:44px;line-height:1}
.bbCard b{font-size:21px}
.bbCard small{font-size:15px;opacity:.95}
.big{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px;align-items:center}
.row input[type=number]{width:70px;padding:6px;border:1px solid var(--line);border-radius:8px}
.meter{height:28px;border-radius:14px;background:#eee;overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .1s,background .3s}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.teams div{text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px}
.teams input{width:100%;text-align:center;border:0;font-weight:700;background:transparent}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.groups div{border:1px solid var(--line);border-radius:10px;padding:8px}
.groups b{display:block;color:var(--accent)}
.vl button{display:block;width:100%;text-align:left;margin:4px 0;padding:10px;border-radius:10px;border:2px solid var(--line);background:#fff}
.vl button.on{border-color:var(--ink);font-weight:700}
.dice{font-size:80px;text-align:center;line-height:1}
.tl{display:flex;flex-direction:column;align-items:center;gap:8px;background:#222;border-radius:20px;padding:12px;width:110px;margin:0 auto}
.tl button{width:70px;height:70px;border-radius:50%;border:0;opacity:.25}
.tl button.on{opacity:1;box-shadow:0 0 24px currentColor}
.checklist label{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:20px}
.checklist input[type=text]{width:100%;padding:6px;border:1px solid var(--line);border-radius:8px}

dialog{border:0;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;max-width:min(560px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin-top:0}
dialog textarea{width:100%;min-height:220px;padding:8px;border:1px solid var(--line);border-radius:8px}
.dlgBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.typeGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.typeGrid button{padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left}
.typeGrid button b{display:block}
.typeGrid button small{color:var(--muted)}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
@media (max-width:900px){
  #editor,#editor.noLeft{grid-template-columns:1fr;height:auto}
  #edLeft,#edLeftShow{display:none!important}
  #edRight{border-left:0;border-top:1px solid var(--line)}
  #slideList{display:flex;gap:8px;overflow-x:auto}
  .sItem{min-width:150px}
  #canvasWrap{min-height:52vw}
  .linkActions .tip{display:none}
}
</style>
</head>
<body>
<header class="top">
  <h1>Class<span>board</span></h1>
  <span id="topActions"></span>
</header>

<!-- HOME -->
<main id="home">
  <div class="toolbar">
    <button class="btn primary" id="newDeck">+ New slideshow</button>
    <button class="btn" id="classListBtn">Class list</button>
    <button class="btn" id="toolsHome">Classroom tools</button>
    <span style="flex:1"></span>
    <button class="btn" id="exportBtn">Back up</button>

    <input type="file" id="importFile" accept=".json,application/json" hidden>

</main>

<!-- EDITOR -->
<section id="editor" class="hidden">
  <aside id="edLeft">
    <div class="sideHead"><b>My tools</b><button class="btn sm primary" id="edDockAdd">+ Add</button><button class="btn sm" id="edLeftHide" title="Hide the tools panel">«</button></div>
    <p class="hint">Your live tools, the same ones you use while presenting. Press ⤢ on a tool to float it anywhere.</p>
    <div id="edDockHost"></div>
  </aside>
  <div id="edMain">
    <div class="edBar">
      <button class="iconBtn" id="edLeftShow" title="Show the tools panel">»</button>
      <button class="tbtn" data-add="text" title="Add a text box"><span class="i">T</span>Text</button>
      <button class="tbtn" id="shapeBtn" title="Add a shape"><span class="i">◆</span>Shape ▾</button>
      <button class="tbtn" data-add="sticky" title="Add a sticky note"><span class="i">🗒</span>Sticky note</button>
      <button class="tbtn" id="picBtn" title="Put a picture on this slide"><span class="i">🖼</span>Picture</button>
      <button class="tbtn" id="edToolsBtn" title="Add a classroom tool to your panel"><span class="i">🧰</span>Tools</button>
      <span class="sep"></span>
      <button class="tbtn" id="bgBtn" title="Colors and background picture"><span class="i">🎨</span>Background</button>
      <span style="flex:1"></span>
      <button class="iconBtn" id="mDup" title="Duplicate slide">⧉</button>
      <button class="iconBtn" id="mUp" title="Move slide up">↑</button>
      <button class="iconBtn" id="mDown" title="Move slide down">↓</button>
      <button class="iconBtn" id="mDel" title="Delete slide">🗑</button>
    </div>
    <div class="edBar" id="selBar"></div>
    <div class="titleRow">
      <label for="slideLabel">Slide title</label><input id="slideLabel" placeholder="Add a title, or leave blank">
      <label for="slideUrl" id="slideUrlL" hidden>Link</label><input id="slideUrl" type="url" hidden placeholder="https://…">
    </div>
    <div id="canvasWrap"></div>
    <p class="edHint" id="edHint"></p>
    <div class="linkCard">
      <div class="linkRow"><span aria-hidden="true">🔗</span><input id="linkUrl" placeholder="Paste a link: YouTube, Google Slides, Canva, a Google Doc or any website"><input id="linkTitle" placeholder="Title (optional)"><button class="pill primary" id="linkAdd">Add slide</button></div>
      <div class="linkActions">
        <button class="pill" id="upBtn">⬆ Upload photo, video or PDF</button>
        <button class="pill" id="msgBtn">💬 Message slide</button>
        <button class="pill" id="newBlank">＋ New slide</button>
        <span class="tip">Tip: paste a screenshot with Ctrl+V, or drop files anywhere</span>
      </div>

    </div>
    <input type="file" id="upFile" accept="image/*,video/*,application/pdf,.pdf" multiple hidden>
    <input type="file" id="picFile" accept="image/*" hidden>
    <input type="file" id="bgFile" accept="image/*" hidden>
  </div>
  <aside id="edRight">
    <div class="adds"><button class="dashBtn" id="addSlide">＋ Add a slide</button><button class="dashBtn" id="addBlank">＋ Title slide</button></div>
    <div id="slideList"></div>

</section>
<div id="drop">Drop to add slides</div>

<!-- PRESENT -->
<div id="present" class="hidden">
  <aside id="pSide">
    <div class="sideHead"><b>My tools</b><button class="btn sm primary" id="dockAdd">+ Add</button><button class="btn sm" id="sideHide" title="Hide the tools panel">«</button></div>
    <div id="dock"></div>
    <div id="pSlidesHead"><b>Slides</b><small id="pThumbCount"></small><span style="flex:1"></span><button class="btn sm" id="thumbsToggle" title="Show or hide slides">▾</button></div>
    <div id="pThumbs"></div>
  </aside>
  <div id="pMain">
    <div id="pBox"><div id="pStage"></div><canvas id="ink" class="off"></canvas><div id="spot" hidden></div></div>
    <button class="darkBtn" id="sideShow" title="Show the tools panel">» Tools</button>
    <button class="darkBtn" id="menusShow" title="Show menus (H)">☰ Show menus</button>
    <div id="pTopRight"><button class="darkBtn" id="pOpen" hidden>Open ↗</button><button class="darkBtn" id="pExitTop">✕ Exit</button></div>
  </div>
  <div id="pBottom">
    <div class="inkBar" id="inkBar">
      <button data-ink="pointer" title="Pointer: click inside slides and links"><span class="i">➤</span>Pointer</button>
      <button data-ink="pen" title="Pen"><span class="i">🖊️</span>Pen</button>
      <button data-ink="pencil" title="Pencil"><span class="i">✏️</span>Pencil</button>
      <button data-ink="highlight" title="Highlighter"><span class="i">🖍️</span>Highlight</button>
      <button data-ink="eraser" title="Eraser: wipe over a line to remove it"><span class="i">🧽</span>Eraser</button>
      <button data-act="undo" title="Undo"><span class="i">↶</span>Undo</button>
      <button data-act="focus" title="Spotlight: dim everything except around the pointer (scroll to resize)"><span class="i">🔦</span>Focus</button>
      <button data-act="clear" title="Clear this slide's drawing"><span class="i">🗑️</span>Clear</button>
      <button data-act="celebrate" title="Celebrate!"><span class="i">🎉</span>Celebrate</button>

    </div>

      <button id="pPrev" title="Previous (←)">‹</button><span id="pNum"></span><button id="pNext" title="Next (→)">›</button>
      <button id="pFull" title="Full screen (F)">⛶</button><button id="pExit" title="Exit (Esc)">✕ Exit</button>
    </div>
  </div>
</div>

<dialog id="dlg"></dialog>
<div id="toast"></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const newId = () => Math.random().toString(36).slice(2, 10);

// ---------- storage: one IndexedDB record holds everything (photos can be large) ----------
const DB_NAME = "classboard", STORE = "kv", KEY = "data";
let db = null;
function openDB(){
  return new Promise(res => {
    try{
      const r = indexedDB.open(DB_NAME, 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE);
        if(!d.objectStoreNames.contains("media")) d.createObjectStore("media");     // uploaded videos (too big to keep with the slides)
      };
      r.onsuccess = () => { db = r.result; res(); };
      r.onerror = () => res();
    }catch(e){ res(); }
  });
}
function load(){
  return new Promise(res => {
    if(!db) return res(null);
    try{ const q = db.transaction(STORE).objectStore(STORE).get(KEY); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }
    catch(e){ res(null); }
  });
}
function putMedia(id, blob){
  return new Promise((res, rej) => {
    try{ const t = db.transaction("media", "readwrite"); t.objectStore("media").put(blob, id); t.oncomplete = res; t.onerror = t.onabort = () => rej(t.error); }
    catch(e){ rej(e); }
  });
}
const mediaURLs = {};
function mediaURL(id){
  if(mediaURLs[id]) return Promise.resolve(mediaURLs[id]);
  return new Promise(res => {
    try{ const q = db.transaction("media").objectStore("media").get(id); q.onsuccess = () => res(q.result ? (mediaURLs[id] = URL.createObjectURL(q.result)) : null); q.onerror = () => res(null); }
    catch(e){ res(null); }
  });
}
const setSaved = t => { const e = $("saveState"); if(e) e.textContent = t; };
let saveTimer;
function save(){
  clearTimeout(saveTimer); setSaved("Saving…");
  saveTimer = setTimeout(() => {
    if(!db){ setSaved("Not saved"); toast("Saving isn't available in this browser window."); return; }
    try{
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(JSON.parse(JSON.stringify(data)), KEY);
      tx.oncomplete = () => setSaved("✓ Saved");
      tx.onerror = tx.onabort = () => { setSaved("Not saved"); toast("Couldn't save. Your computer may be out of space."); };
    }catch(e){ setSaved("Not saved"); toast("Couldn't save: " + e.message); }
  }, 250);
}

let data = {decks:[], classList:[]};
let deck = null, cur = 0;

let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }

// ---------- themes ----------
const THEMES = [
  {id:"paper", bg:"#fbf8f1", ink:"#1f2a2e", accent:"#2f6f62"},
  {id:"sky", bg:"#e7f1fb", ink:"#18324a", accent:"#2a6db0"},
  {id:"mint", bg:"#e6f5ee", ink:"#173b2e", accent:"#1f8a5b"},
  {id:"peach", bg:"#fdeee4", ink:"#4a2618", accent:"#d0632b"},
  {id:"lilac", bg:"#f0eafb", ink:"#2e1f4a", accent:"#7550c2"},
  {id:"sun", bg:"#fff6d6", ink:"#3d3208", accent:"#c99700"},
  {id:"chalk", bg:"#24352f", ink:"#f2f2ea", accent:"#9fe0c4"},
  {id:"night", bg:"#161a2b", ink:"#eef0ff", accent:"#ffb547"},
];
const theme = id => THEMES.find(t => t.id === id) || THEMES[0];

// ---------- link parsing: YouTube, Google Slides/Docs/Drive, Canva, any https page ----------
function parseLink(raw){
  let s = String(raw || "").trim(); if(!s) return null;
  if(!/^https?:\/\//i.test(s)) s = "https://" + s;
  let u; try{ u = new URL(s); }catch(e){ return null; }
  if(u.protocol !== "https:" && u.protocol !== "http:") return null;
  const h = u.hostname.replace(/^www\./, "");
  // YouTube
  let yt = null;
  if(h === "youtu.be") yt = u.pathname.slice(1).split("/")[0];
  else if(/(^|\.)youtube\.com$/.test(h)){
    yt = u.searchParams.get("v") || (u.pathname.match(/^\/(?:shorts|live|embed)\/([^/?]+)/) || [])[1];
  }
  if(yt && /^[\w-]{6,}$/.test(yt)){
    const t = parseInt(u.searchParams.get("t") || u.searchParams.get("start") || "0", 10);
    return {kind:"youtube", embed:`https://www.youtube-nocookie.com/embed/${yt}?rel=0${t ? "&start=" + t : ""}`, open:s};
  }
  // Google Slides (shared or "Publish to web")
  if(h === "docs.google.com"){
    let m = u.pathname.match(/^\/presentation\/d\/e\/([\w-]+)/);
    if(m) return {kind:"gslides", embed:`https://docs.google.com/presentation/d/e/${m[1]}/embed?start=false&loop=false&delayms=60000`, open:s};
    m = u.pathname.match(/^\/presentation\/d\/([\w-]+)/);
    if(m) return {kind:"gslides", embed:`https://docs.google.com/presentation/d/${m[1]}/embed?start=false&loop=false&delayms=60000`, open:s};
    m = u.pathname.match(/^\/(document|spreadsheets|forms)\/d\/(e\/)?([\w-]+)/);
    if(m) return {kind:"gdoc", embed:`https://docs.google.com/${m[1]}/d/${m[2] || ""}${m[3]}/${m[1] === "forms" ? "viewform?embedded=true" : "preview"}`, open:s};
  }
  if(h === "drive.google.com"){
    const m = u.pathname.match(/^\/file\/d\/([\w-]+)/);
    if(m) return {kind:"gdrive", embed:`https://drive.google.com/file/d/${m[1]}/preview`, open:s};
  }
  if(/(^|\.)canva\.com$/.test(h)){
    const m = u.pathname.match(/^\/design\/([\w-]+)\/([\w-]+)/);
    if(m) return {kind:"canva", embed:`https://www.canva.com/design/${m[1]}/${m[2]}/view?embed`, open:s};
  }
  if(h === "vimeo.com"){
    const m = u.pathname.match(/^\/(\d+)/);
    if(m) return {kind:"vimeo", embed:`https://player.vimeo.com/video/${m[1]}`, open:s};
  }
  return {kind:"web", embed:u.href, open:s};
}
const LINK_HELP = {
  gslides:"Google Slides: in Slides choose Share → General access → “Anyone with the link”, or File → Share → Publish to web. Use the arrows inside the slide to move through it.",
  youtube:"YouTube: any normal video link works.",
  web:"Some websites don't allow being shown inside another page. If it stays blank, use the Open button while presenting."
};

// ---------- slides ----------
const TYPE_NAME = {blank:"Blank", title:"Message", text:"Text & list", image:"Picture", upload:"Video", gslides:"Google Slides", video:"YouTube", link:"Link"};
function makeSlide(type, extra){
  const s = {id:newId(), type, items:[]};
  if(type === "title") Object.assign(s, {title:"Good morning!", body:""});
  if(type === "text") Object.assign(s, {title:"Today we will…", body:"• \n• \n• "});
  if(type === "blank") s.title = "";
  return Object.assign(s, extra || {});
}
// The everyday new slide: a big title and a subtitle, both normal text boxes the teacher can move, edit or delete
function titleSlide(){
  return makeSlide("blank", {items:[
    {id:newId(), kind:"text", x:.05, y:.3, w:.9, h:.2, fs:6.4, text:"YOUR TITLE HERE", font:"display", align:"center"},
    {id:newId(), kind:"text", x:.15, y:.54, w:.7, h:.1, fs:3, text:"Add a subtitle", align:"center"}
  ]});
}
// A slide = its colors/background + its main content (by type) + things placed on top (items)
function renderStage(slide, d, opts = {}){
  const th = theme(slide.theme || d.theme);
  const el = document.createElement("div");
  el.className = "stage" + (slide.type === "title" ? " layout-title" : "");
  const bgCol = slide.bgColor || th.bg;
  el.style.background = slide.bgImg ? `${bgCol} url("${slide.bgImg}") center / cover no-repeat` : bgCol;
  el.style.color = th.ink;
  const cap = slide.title || slide.caption || "";
  if(slide.type === "title" || slide.type === "text"){
    el.innerHTML = `<div class="content"><h2 class="st" style="color:${th.accent}">${esc(slide.title)}</h2>${slide.body || opts.edit ? `<div class="sb">${esc(slide.body)}</div>` : ""}</div>`;
    const sb = el.querySelector(".sb");
    if(opts.edit && sb){ sb.contentEditable = "true"; sb.addEventListener("input", () => { slide.body = sb.innerText; if(opts.onChange) opts.onChange(); }); }
  } else if(slide.type === "blank"){
    if(slide.title) el.innerHTML = `<div class="content" style="justify-content:flex-start"><h2 class="st" style="color:${th.accent}">${esc(slide.title)}</h2></div>`;
  } else if(slide.type === "image"){
    el.innerHTML = slide.src ? `<img class="full" alt="" src="${esc(slide.src)}">` : `<div class="ph"><b>Picture</b>No picture yet</div>`;
  } else if(slide.type === "upload"){
    if(opts.thumb) el.innerHTML = `<div class="ph" style="background:${th.accent}"><b>▶ Video</b>${esc(slide.fileName || "")}</div>`;
    else{
      el.innerHTML = `<video class="full" controls playsinline preload="metadata"></video>`;
      mediaURL(slide.mediaId).then(u => { if(u) el.querySelector("video").src = u; else el.innerHTML = `<div class="ph"><b>Video missing</b>This video was added on a different computer.</div>`; });
    }
  } else {
    const p = parseLink(slide.url);
    if(!p) el.innerHTML = `<div class="ph"><b>${TYPE_NAME[slide.type] || "Link"}</b>Paste a link in the Link box above</div>`;
    else if(opts.thumb) el.innerHTML = `<div class="ph" style="background:${th.accent}"><b>${{gslides:"Google Slides",youtube:"▶ YouTube",gdoc:"Google Doc",gdrive:"Google Drive",canva:"Canva",vimeo:"▶ Vimeo",web:"Web page"}[p.kind]}</b>${esc(new URL(p.embed).hostname)}</div>`;
    else el.innerHTML = `<iframe src="${esc(p.embed)}" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
  }
  if(cap && !["title","text","blank"].includes(slide.type)) el.insertAdjacentHTML("beforeend", `<div class="cap">${esc(cap)}</div>`);
  renderItems(el, slide, !!opts.edit);
  return el;
}
const SHAPES = {
  rect:"", round:"border-radius:2.2cqw", circle:"border-radius:50%",
  triangle:"clip-path:polygon(50% 0,100% 100%,0 100%)",
  star:"clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)",
  arrow:"clip-path:polygon(0 30%,62% 30%,62% 5%,100% 50%,62% 95%,62% 70%,0 70%)",
  speech:"border-radius:3cqw 3cqw 3cqw 0", diamond:"clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)"
};
function itemHTML(it){
  const box = `left:${it.x * 100}%;top:${it.y * 100}%;width:${it.w * 100}%;height:${it.h * 100}%;font-size:${it.fs || 3}cqw;${it.ink ? `color:${it.ink};` : ""}`
    + (it.font === "display" ? `font-family:'Lilita One','Arial Black',Impact,sans-serif;` : "")
    + (it.align === "center" ? "justify-content:center;text-align:center;" : "");
  if(it.kind === "image") return `<div class="item k-image" data-id="${it.id}" style="${box}"><img alt="" src="${esc(it.src)}"><span class="hd"></span></div>`;
  const fill = it.kind === "text" ? "" : `background:${it.fill || "#ffe680"};`;
  const shape = it.kind === "shape" ? SHAPES[it.shape] || "" : "";
  return `<div class="item k-${it.kind}" data-id="${it.id}" style="${box}${fill}${shape}"><div class="tx">${esc(it.text || "")}</div><span class="hd"></span></div>`;
}
function renderItems(stageEl, slide, edit){
  const items = slide.items || [];
  if(!items.length && !edit) return;
  const layer = document.createElement("div"); layer.className = "items" + (edit ? " edit" : "");
  layer.innerHTML = items.map(itemHTML).join("");
  stageEl.appendChild(layer);
  if(edit) wireItems(layer, slide);
}

// ---------- home ----------
function showHome(){
  deck = null;
  $("home").classList.remove("hidden"); $("editor").classList.add("hidden");
  $("topActions").innerHTML = "";
  const g = $("decks"); g.innerHTML = "";
  if(!data.decks.length){ g.innerHTML = `<div class="empty" style="grid-column:1/-1">No slideshows yet. Choose <b>+ New slideshow</b> to make one.</div>`; return; }
  [...data.decks].sort((a, b) => b.updated - a.updated).forEach(d => {
    const c = document.createElement("div"); c.className = "card";
    const th = theme(d.theme);
    c.innerHTML = `<div class="thumb" style="background:${th.bg};color:${th.accent}">${esc(d.name)}</div>
      <div class="meta"><b>${esc(d.name)}</b><small>${d.slides.length} slide${d.slides.length === 1 ? "" : "s"}</small>
      <button class="btn sm primary" data-a="present">Present</button><button class="btn sm" data-a="edit">Edit</button>
      <button class="btn sm" data-a="copy" title="Duplicate">⧉</button><button class="btn sm danger" data-a="del" title="Delete">🗑</button></div>`;
    c.querySelector(".thumb").onclick = () => openEditor(d);
    c.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
      const a = b.dataset.a;
      if(a === "edit") openEditor(d);
      if(a === "present"){ deck = d; startPresent(0); }
      if(a === "copy"){ const n = JSON.parse(JSON.stringify(d)); n.id = newId(); n.name += " (copy)"; n.updated = Date.now(); n.slides.forEach(s => s.id = newId()); data.decks.push(n); save(); showHome(); }
      if(a === "del" && await confirmBox(`Delete “${d.name}”? This can't be undone.`, "Delete")){ data.decks = data.decks.filter(x => x !== d); save(); showHome(); }
    });
    g.appendChild(c);
  });
}
$("newDeck").onclick = async () => {
  const name = await promptBox("Name your slideshow", "Monday morning");
  if(name === null) return;
  const d = {id:newId(), name:name.trim() || "Untitled slideshow", theme:"paper", created:Date.now(), updated:Date.now(), slides:[titleSlide()]};
  data.decks.push(d); save(); openEditor(d);
};

// ---------- editor ----------
const editorOpen = () => !$("editor").classList.contains("hidden");
let selId = null;
function openEditor(d){
  deck = d; cur = Math.max(0, Math.min(cur, d.slides.length - 1)); selId = null;
  d.slides.forEach(s => s.items = s.items || []);
  $("home").classList.add("hidden"); $("editor").classList.remove("hidden");
  $("editor").classList.toggle("noLeft", !!data.edLeftHidden);
  $("topActions").innerHTML = `<button class="btn" id="backHome" title="All slideshows">☰ Slideshows</button><input id="deckName" class="deckName" aria-label="Slideshow name"><span id="saveState" class="saveState">✓ Saved</span><button class="btn primary" id="presentBtn">▶ Present</button>`;
  $("deckName").value = d.name;
  $("deckName").oninput = e => { deck.name = e.target.value; touch(); };
  $("backHome").onclick = showHome;
  $("presentBtn").onclick = () => startPresent(cur);
  $("edDockHost").appendChild($("dock")); buildDock();
  renderEditor();
}
function touch(){ deck.updated = Date.now(); save(); }
const curSlide = () => deck && deck.slides[cur];
function renderEditor(){ renderSlideList(); renderCanvas(); }
const slideName = s => s.title || ((s.items || []).find(x => x.kind === "text" && (x.text || "").trim()) || {}).text || TYPE_NAME[s.type] || "";
function renderSlideList(){
  const list = $("slideList"); list.innerHTML = "";
  deck.slides.forEach((s, i) => {
    const it = document.createElement("div"); it.className = "sItem" + (i === cur ? " on" : "");
    it.innerHTML = `<span class="n">${i + 1}</span><div class="sw"><div class="sbox thumbStage"><button class="sDel" title="Delete slide">🗑</button></div><div class="lbl">${esc(slideName(s))}</div></div>`;
    it.querySelector(".sbox").appendChild(renderStage(s, deck, {thumb:true}));
    it.onclick = e => { if(e.target.closest(".sDel")) return; cur = i; selId = null; renderEditor(); };
    it.querySelector(".sDel").onclick = () => deleteSlide(i);
    list.appendChild(it);
  });
  const on = list.children[cur]; if(on) on.scrollIntoView({block:"nearest"});
}
function refreshThumb(){
  const it = $("slideList").children[cur], s = curSlide(); if(!it || !s) return;
  it.querySelector(".sbox .stage").replaceWith(renderStage(s, deck, {thumb:true}));
  it.querySelector(".lbl").textContent = slideName(s);
}

function shrinkImage(file, max){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {

      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res({src:c.toDataURL(file.type === "image/png" ? "image/png" : "image/jpeg", .85), w:c.width, h:c.height});
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}

async function handleFiles(files){

  if(!files.length){ toast("Choose a photo, a video or a PDF."); return; }
  if(!deck || !editorOpen()){
    const d = {id:newId(), name:files[0].name.replace(/\.[^.]+$/, "").slice(0, 60) || "New slideshow", theme:"paper", created:Date.now(), updated:Date.now(), slides:[]};
    data.decks.push(d); cur = 0; openEditor(d); cur = -1;
  }
  for(const f of files){
    try{
      if(/\.pdf$/i.test(f.name) || f.type === "application/pdf") await importPdf(f);
      else if(f.type.startsWith("image/")) insertSlide(makeSlide("image", {src:(await shrinkImage(f, 1920)).src}));
      else{

// PDF pages become picture slides. pdf.js 4.x, with font code evaluation turned off.
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/";
let pdfjsP = null;
function loadPdfjs(){
  if(!pdfjsP) pdfjsP = import(PDFJS + "pdf.min.mjs").then(m => { m.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.mjs"; return m; }).catch(e => { pdfjsP = null; throw e; });
  return pdfjsP;
}
async function importPdf(file){
  const d = $("dlg");
  d.innerHTML = `<h3>Bringing in ${esc(file.name)}</h3><p id="pdfMsg">Opening the PDF…</p><div class="meter"><i id="pdfBar" style="background:var(--accent)"></i></div>`;
  d.oncancel = e => e.preventDefault(); d.showModal();
  try{
    let pdfjs;
    try{ pdfjs = await loadPdfjs(); }catch(e){ throw new Error("The PDF reader needs the internet the first time. Check the connection and try again."); }
    const pdf = await pdfjs.getDocument({data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise;
    const n = Math.min(pdf.numPages, 100);
    for(let p = 1; p <= n; p++){
      $("pdfMsg").textContent = `Page ${p} of ${n}…`; $("pdfBar").style.width = (p - 1) / n * 100 + "%";
      const page = await pdf.getPage(p), v1 = page.getViewport({scale:1});
      const vp = page.getViewport({scale:Math.min(1920 / v1.width, 1080 / v1.height)});
      const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      // "print" rendering doesn't wait for screen repaints, so a big PDF keeps going even if the tab is in the background
      await page.render({canvasContext:ctx, viewport:vp, intent:"print"}).promise;
      const s = makeSlide("image", {src:c.toDataURL("image/jpeg", .85), bgColor:"#ffffff"});
      deck.slides.splice(cur + 1, 0, s); cur = deck.slides.indexOf(s);
      page.cleanup();
    }
    touch(); d.close();
    toast(pdf.numPages > n ? `Added the first ${n} of ${pdf.numPages} pages.` : `Added ${n} page${n === 1 ? "" : "s"} from the PDF.`);
    pdf.destroy();
  }catch(e){
    d.close(); console.warn(e);
    toast(/password/i.test(e.name + e.message) ? "That PDF has a password. Save a copy without one and try again." : e.message || "Couldn't read that PDF.");
  }
}

// ---------- dialogs ----------
function confirmBox(msg, ok = "OK"){
  return new Promise(res => {
    const d = $("dlg");
    d.innerHTML = `<p>${esc(msg)}</p><div class="dlgBtns"><button class="btn" id="dNo">Cancel</button><button class="btn primary" id="dYes">${esc(ok)}</button></div>`;
    const done = v => { d.close(); res(v); };
    $("dYes").onclick = () => done(true); $("dNo").onclick = () => done(false);
    d.oncancel = e => { e.preventDefault(); done(false); };
    d.showModal();
  });
}
function promptBox(msg, value = ""){
  return new Promise(res => {
    const d = $("dlg");
    d.innerHTML = `<h3>${esc(msg)}</h3><input type="text" id="dIn" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px" value="${esc(value)}"><div class="dlgBtns"><button class="btn" id="dNo">Cancel</button><button class="btn primary" id="dYes">OK</button></div>`;
    const done = v => { d.close(); res(v); };
    $("dYes").onclick = () => done($("dIn").value); $("dNo").onclick = () => done(null);
    $("dIn").onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); done($("dIn").value); } };
    d.oncancel = e => { e.preventDefault(); done(null); };
    d.showModal(); $("dIn").select();
  });
}
function classListDialog(){
  const d = $("dlg");
  d.innerHTML = `<h3>Class list</h3><p class="hint">One student per line. Used by the name picker, group maker and checklists. It stays on this computer.</p><textarea id="clText">${esc(data.classList.join("\n"))}</textarea><div class="dlgBtns"><button class="btn" id="dNo">Cancel</button><button class="btn primary" id="dYes">Save</button></div>`;
  $("dYes").onclick = () => { data.classList = $("clText").value.split("\n").map(s => s.trim()).filter(Boolean); save(); d.close(); toast(`Saved ${data.classList.length} names.`); };
  $("dNo").onclick = () => d.close();

}
$("classListBtn").onclick = classListDialog;

// ---------- backup / restore ----------
$("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `classboard-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  try{
    const inc = JSON.parse(await f.text());
    if(!inc || !Array.isArray(inc.decks)) throw new Error("not a backup");
    const have = new Set(data.decks.map(d => d.id));
    let added = 0;
    inc.decks.forEach(d => { if(d && Array.isArray(d.slides)){ if(have.has(d.id)) d.id = newId(); data.decks.push(d); added++; } });
    if(Array.isArray(inc.classList) && !data.classList.length) data.classList = inc.classList.map(String);
    save(); showHome(); toast(`Restored ${added} slideshow${added === 1 ? "" : "s"}.`);
  }catch(err){ toast("That file isn't a Classboard backup."); }
};

// ---------- present mode: tool dock (left), slide (middle), drawing bar + slide controls (bottom) ----------
const pres = $("present");
const isPresenting = () => !pres.classList.contains("hidden");
function startPresent(i){
  if(!deck || !deck.slides.length){ toast("Add a slide first."); return; }
  cur = i; pres.classList.remove("hidden"); document.body.style.overflow = "hidden";
  pres.classList.toggle("noSide", !!data.sideHidden);
  closePop(); selId = null;
  $("pSide").insertBefore($("dock"), $("pSlidesHead"));       // the same live tools follow you into Present
  buildDock(); renderThumbs(); setInk("pointer"); showPresentSlide();
}
function showPresentSlide(){
  const s = deck.slides[cur], host = $("pStage"); host.innerHTML = "";
  host.appendChild(renderStage(s, deck));
  $("pNum").textContent = `Slide ${cur + 1}`;
  $("pThumbCount").textContent = `${cur + 1} of ${deck.slides.length}`;
  $("pThumbs").querySelectorAll(".pThumb").forEach((t, k) => t.classList.toggle("on", k === cur));
  const on = $("pThumbs").children[cur]; if(on) on.scrollIntoView({block:"nearest"});
  const p = s.url && parseLink(s.url);
  $("pOpen").hidden = !p; $("pOpen").onclick = () => p && window.open(p.open, "_blank", "noopener");
  fitStage();
}
function renderThumbs(){
  const t = $("pThumbs"); t.innerHTML = "";
  t.classList.toggle("closed", !!data.thumbsHidden);
  deck.slides.forEach((s, k) => {
    const d = document.createElement("div"); d.className = "pThumb thumbStage";
    d.innerHTML = `<span class="n">${k + 1}</span>`; d.appendChild(renderStage(s, deck, {thumb:true}));
    d.onclick = () => { cur = k; showPresentSlide(); };
    t.appendChild(d);
  });
}
// keep the slide as big as the free space allows, at 16:9
function fitStage(){
  if(!isPresenting()) return;
  const m = $("pMain"), pad = 16;
  const w = Math.max(100, Math.min(m.clientWidth - pad * 2, (m.clientHeight - pad * 2) * 16 / 9));
  $("pBox").style.width = w + "px";
  sizeInk();
}
new ResizeObserver(fitStage).observe($("pMain"));
function go(n){ if(!deck) return; const nx = Math.max(0, Math.min(deck.slides.length - 1, cur + n)); if(nx !== cur){ cur = nx; showPresentSlide(); } }
function stopPresent(){
  pres.classList.add("hidden"); document.body.style.overflow = ""; $("pStage").innerHTML = "";
  setFocus(false);
  if(document.fullscreenElement) document.exitFullscreen().catch(() => {});
  if(editorOpen()){ $("edDockHost").appendChild($("dock")); renderEditor(); }
}
function toggleMenus(force){ pres.classList.toggle("noMenus", force); if(pres.classList.contains("noMenus")) setInk(P.tool); setTimeout(fitStage, 0); }
function toggleSide(hide){ pres.classList.toggle("noSide", hide); data.sideHidden = pres.classList.contains("noSide"); save(); setTimeout(fitStage, 0); }
$("pPrev").onclick = () => go(-1); $("pNext").onclick = () => go(1);
$("pExit").onclick = $("pExitTop").onclick = stopPresent;
$("pFull").onclick = () => { if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => toast("Full screen isn't allowed here.")); };
$("sideHide").onclick = () => toggleSide(true); $("sideShow").onclick = () => toggleSide(false);
$("menusShow").onclick = () => toggleMenus(false);
$("thumbsToggle").onclick = () => { data.thumbsHidden = !data.thumbsHidden; save(); $("pThumbs").classList.toggle("closed", data.thumbsHidden); $("thumbsToggle").textContent = data.thumbsHidden ? "▸" : "▾"; };
document.addEventListener("keydown", e => {
  if(!isPresenting() || e.target.closest("input,textarea,select,dialog,.tool")) return;
  const k = e.key.toLowerCase();
  if(["ArrowRight","PageDown"," "].includes(e.key)){ e.preventDefault(); go(1); }
  else if(["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); go(-1); }
  else if(e.key === "Escape"){ if(P.focus) setFocus(false); else if(P.tool !== "pointer") setInk("pointer"); else if(!document.fullscreenElement) stopPresent(); }
  else if(k === "f") $("pFull").click();
  else if(k === "h") toggleMenus();
  else if(k === "p") setInk("pen");
  else if(k === "e") setInk("eraser");
  else if((e.ctrlKey || e.metaKey) && k === "z"){ e.preventDefault(); inkUndo(); }
});

// ---------- drawing on slides (saved with each slide) ----------
const INK_STYLE = {pen:{w:.0045, a:1}, pencil:{w:.0018, a:.8}, highlight:{w:.024, a:.33}};
const INK_COLORS = ["#e0412f","#1d1d1d","#2a6db0","#1f8a5b","#f2b300","#ffffff","#c4407a"];
const P = {tool:"pointer", color:INK_COLORS[0], focus:false, line:null, erasing:false, undo:{}};
$("inkColors").innerHTML = INK_COLORS.map((c, i) => `<button data-c="${c}" class="${i ? "" : "on"}" style="background:${c}" title="Ink color"></button>`).join("");
$("inkColors").querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
  P.color = b.dataset.c; $("inkColors").querySelectorAll("[data-c]").forEach(x => x.classList.toggle("on", x === b));
  if(P.tool === "pointer" || P.tool === "eraser") setInk("pen");
});
// Thickness: a multiplier on INK_STYLE.w, remembered separately for pen, pencil and highlighter
const INK_SIZES = [[.5, "Thin"], [1, "Medium"], [2, "Thick"], [3.5, "Extra thick"]];
const inkSizeOf = t => ((data.inkSize || {})[t]) || 1;
const sizeTool = () => INK_STYLE[P.tool] ? P.tool : "pen";
$("inkSizes").innerHTML = INK_SIZES.map(([m, n]) => `<button data-s="${m}" title="${n}"><i></i></button>`).join("");
$("inkSizes").querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
  if(!INK_STYLE[P.tool]) setInk("pen");
  data.inkSize = Object.assign({}, data.inkSize, {[P.tool]:+b.dataset.s}); save(); paintSizes();
});
function paintSizes(){
  const t = sizeTool(), st = INK_STYLE[t];
  $("inkSizes").querySelectorAll("[data-s]").forEach(b => {
    const m = +b.dataset.s, d = Math.round(Math.max(3, Math.min(24, st.w * m * 1400)));   // dot ≈ line on a typical screen
    Object.assign(b.querySelector("i").style, {width:d + "px", height:d + "px", opacity:st.a, borderRadius:t === "highlight" ? "2px" : "50%"});
    b.classList.toggle("on", m === inkSizeOf(t));
  });
}
$("inkBar").querySelectorAll("[data-ink]").forEach(b => b.onclick = () => setInk(b.dataset.ink));
$("inkBar").querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
  const a = b.dataset.act;
  if(a === "undo") inkUndo();
  if(a === "clear"){ const s = deck.slides[cur]; if(s.ink && s.ink.length){ pushUndo(s); s.ink = []; inkChanged(); } }
  if(a === "focus") setFocus(!P.focus);
  if(a === "celebrate") celebrate();
  if(a === "hide") toggleMenus(true);
});
function setInk(t){
  P.tool = t;
  $("inkBar").querySelectorAll("[data-ink]").forEach(b => b.classList.toggle("on", b.dataset.ink === t));
  $("ink").classList.toggle("off", t === "pointer");
  $("ink").style.cursor = t === "eraser" ? "cell" : "crosshair";
  paintSizes();
}
function setFocus(on){
  P.focus = on; $("spot").hidden = !on;
  $("inkBar").querySelector('[data-act="focus"]').classList.toggle("on", on);
}
$("pMain").addEventListener("pointermove", e => {
  if(!P.focus) return;
  const r = $("pBox").getBoundingClientRect();
  $("spot").style.setProperty("--x", (e.clientX - r.left) + "px"); $("spot").style.setProperty("--y", (e.clientY - r.top) + "px");
});
$("pMain").addEventListener("wheel", e => {
  if(!P.focus) return; e.preventDefault();
  const cs = parseFloat(getComputedStyle($("spot")).getPropertyValue("--r")) || 170;
  $("spot").style.setProperty("--r", Math.max(60, Math.min(600, cs - e.deltaY * .4)) + "px");
}, {passive:false});
function sizeInk(){
  const c = $("ink"), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  drawInk();
}
function drawInk(){
  const c = $("ink"), ctx = c.getContext("2d"), s = deck && deck.slides[cur];
  ctx.clearRect(0, 0, c.width, c.height);
  if(!s || !s.ink) return;
  s.ink.forEach(l => {
    const st = INK_STYLE[l.t] || INK_STYLE.pen;
    ctx.save(); ctx.globalAlpha = st.a; ctx.strokeStyle = ctx.fillStyle = l.c; ctx.lineWidth = Math.max(1, st.w * (l.s || 1) * c.width);
    ctx.lineCap = l.t === "highlight" ? "square" : "round"; ctx.lineJoin = "round";
    const pts = l.p;
    if(pts.length === 1){ ctx.beginPath(); ctx.arc(pts[0][0] * c.width, pts[0][1] * c.height, ctx.lineWidth / 2, 0, 7); ctx.fill(); }
    else{
      ctx.beginPath(); ctx.moveTo(pts[0][0] * c.width, pts[0][1] * c.height);
      for(let i = 1; i < pts.length - 1; i++){        // smooth the line through midpoints
        const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
        ctx.quadraticCurveTo(pts[i][0] * c.width, pts[i][1] * c.height, mx * c.width, my * c.height);
      }
      const last = pts[pts.length - 1]; ctx.lineTo(last[0] * c.width, last[1] * c.height); ctx.stroke();
    }
    ctx.restore();
  });
}
function pushUndo(s){ const u = P.undo[s.id] = P.undo[s.id] || []; u.push(JSON.stringify(s.ink || [])); if(u.length > 40) u.shift(); }
function inkUndo(){ const s = deck.slides[cur], u = P.undo[s.id]; if(!u || !u.length) return; s.ink = JSON.parse(u.pop()); inkChanged(); }
function inkChanged(){ drawInk(); deck.updated = Date.now(); save(); }
const inkPt = e => { const r = $("ink").getBoundingClientRect(); return [Math.round((e.clientX - r.left) / r.width * 10000) / 10000, Math.round((e.clientY - r.top) / r.height * 10000) / 10000]; };
function eraseAt(pt){
  const s = deck.slides[cur]; if(!s.ink) return;
  const r = $("ink").getBoundingClientRect(), tol = 14;
  const near = l => l.p.some(q => Math.hypot((q[0] - pt[0]) * r.width, (q[1] - pt[1]) * r.height) < tol + (INK_STYLE[l.t] || INK_STYLE.pen).w * (l.s || 1) * r.width / 2);
  const keep = s.ink.filter(l => !near(l));
  if(keep.length !== s.ink.length){ s.ink = keep; drawInk(); }
}
const ink = $("ink");
ink.addEventListener("pointerdown", e => {
  if(P.tool === "pointer") return;
  e.preventDefault(); ink.setPointerCapture(e.pointerId);
  const s = deck.slides[cur]; pushUndo(s); s.ink = s.ink || [];
  if(P.tool === "eraser"){ P.erasing = true; eraseAt(inkPt(e)); return; }
  P.line = {t:P.tool, c:P.tool === "highlight" && P.color === "#e0412f" ? "#f2d600" : P.color, s:inkSizeOf(P.tool), p:[inkPt(e)]};
  s.ink.push(P.line); drawInk();
});
ink.addEventListener("pointermove", e => {
  if(P.erasing){ eraseAt(inkPt(e)); return; }
  if(!P.line) return;
  const pt = inkPt(e), last = P.line.p[P.line.p.length - 1];
  if(Math.abs(pt[0] - last[0]) + Math.abs(pt[1] - last[1]) < .0015) return;
  P.line.p.push(pt); drawInk();
});
const inkEnd = () => { if(P.line || P.erasing){ P.line = null; P.erasing = false; inkChanged(); } };
ink.addEventListener("pointerup", inkEnd); ink.addEventListener("pointercancel", inkEnd);

// ---------- celebrate: confetti burst ----------
function celebrate(){
  const c = document.createElement("canvas"); c.id = "fx"; document.body.appendChild(c);
  const dpr = window.devicePixelRatio || 1; c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  const ctx = c.getContext("2d"), cols = ["#e0412f","#f2b300","#1f8a5b","#2a6db0","#c4407a","#7550c2"];
  const parts = Array.from({length:220}, () => ({x:c.width * (.2 + Math.random() * .6), y:c.height * .75, vx:(Math.random() - .5) * 22 * dpr, vy:-(12 + Math.random() * 18) * dpr,
    s:(6 + Math.random() * 8) * dpr, r:Math.random() * 6, vr:(Math.random() - .5) * .4, col:cols[Math.floor(Math.random() * cols.length)]}));
  const t0 = performance.now();
  const step = t => {
    ctx.clearRect(0, 0, c.width, c.height);
    parts.forEach(p => { p.vy += .55 * dpr; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.col; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if(t - t0 < 3500) requestAnimationFrame(step); else c.remove();
  };
  requestAnimationFrame(step);
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784, 1047].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t1 = actx.currentTime + i * .12;
      o.type = "triangle"; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.0001, t1); g.gain.exponentialRampToValueAtTime(.25, t1 + .02); g.gain.exponentialRampToValueAtTime(.0001, t1 + .4);
      o.start(t1); o.stop(t1 + .42);
    });
  }catch(e){}
}

// ---------- classroom tools: cards that live in the side dock or float anywhere ----------
const TOOLS = [
  {id:"timer", name:"Timer", icon:"⏱", build:toolTimer},
  {id:"picker", name:"Name picker", icon:"🎡", build:toolPicker},
  {id:"groups", name:"Group maker", icon:"👥", build:toolGroups},
  {id:"noise", name:"Noise meter", icon:"🔊", build:toolNoise},
  {id:"voice", name:"Voice level", icon:"🗣", build:toolVoice},
  {id:"score", name:"Scoreboard", icon:"🏆", build:toolScore},
  {id:"light", name:"Traffic light", icon:"🚦", build:toolLight},
  {id:"dice", name:"Dice", icon:"🎲", build:toolDice},
  {id:"checklist", name:"Checklist", icon:"✅", build:toolChecklist},
  {id:"stopwatch", name:"Stopwatch", icon:"⏲", build:toolStopwatch},
  {id:"jar", name:"Reward jar", icon:"🫙", build:toolJar},
  {id:"captions", name:"Live captions", icon:"💬", build:toolCaptions},
  {id:"target", name:"Learning target", icon:"🎯", build:toolTarget},
  {id:"brainbreak", name:"Brain break", icon:"🤸", build:toolBrainBreak},
];
// settings a tool keeps between visits (reward jar count, learning target, …)
function toolState(id, def){
  data.toolState = data.toolState || {};
  if(!data.toolState[id]) data.toolState[id] = def;
  return data.toolState[id];
}
// one live copy of each tool: it keeps running while you change slides, and moves between dock and floating
const liveTools = new Map();
let toolZ = 70, toolN = 0;
function toolPicker_(title, onPick){
  const d = $("dlg");
  d.innerHTML = `<h3>${esc(title)}</h3><div class="typeGrid">${TOOLS.map(t => `<button data-tool="${t.id}"><b>${t.icon} ${t.name}</b>${liveTools.has(t.id) ? "<small>Open</small>" : ""}</button>`).join("")}</div><div class="dlgBtns"><button class="btn" id="dX">Close</button></div>`;
  d.querySelectorAll("[data-tool]").forEach(b => b.onclick = () => { d.close(); onPick(b.dataset.tool); });
  $("dX").onclick = () => d.close();
  d.showModal();
}
$("toolsHome").onclick = () => toolPicker_("Classroom tools", id => openTool(id));
$("dockAdd").onclick = () => toolPicker_("Add a tool to your panel", id => dockTool(id));
function makeTool(id){
  const t = TOOLS.find(x => x.id === id); if(!t) return null;
  const el = document.createElement("div"); el.className = "tool"; el.dataset.id = id;
  el.innerHTML = `<div class="th"><b>${t.icon} ${t.name}</b><span class="tbtns"></span></div><div class="tb"></div>`;
  const card = {id, el, mode:"", api:{}};
  card.api = t.build(el.querySelector(".tb")) || {};
  el.addEventListener("pointerdown", () => { if(card.mode === "floating") el.style.zIndex = ++toolZ; });
  const head = el.querySelector(".th");
  head.addEventListener("pointerdown", e => {
    if(card.mode !== "floating" || e.target.closest("button")) return;
    const sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop; head.setPointerCapture(e.pointerId);
    const mv = ev => { el.style.left = Math.max(0, Math.min(innerWidth - 80, ev.clientX - sx)) + "px"; el.style.top = Math.max(0, Math.min(innerHeight - 40, ev.clientY - sy)) + "px"; };
    const up = () => { head.removeEventListener("pointermove", mv); head.removeEventListener("pointerup", up); };
    head.addEventListener("pointermove", mv); head.addEventListener("pointerup", up);
  });
  liveTools.set(id, card);
  return card;
}
function paintToolHead(card){
  const docked = card.mode === "docked", b = card.el.querySelector(".tbtns");
  b.innerHTML = (docked ? `<button data-b="up" title="Move up">▲</button><button data-b="down" title="Move down">▼</button>` : "")
    + `<button data-b="min" title="Shrink or grow">${card.el.classList.contains("min") ? "▢" : "–"}</button>`
    + `<button data-b="move" title="${docked ? "Pop out: float it anywhere on the screen" : "Put it in the tools panel"}">${docked ? "⤢" : "⇲"}</button>`
    + `<button data-b="close" title="Close">✕</button>`;
  b.querySelectorAll("[data-b]").forEach(x => x.onclick = () => {
    const a = x.dataset.b;
    if(a === "up" && card.el.previousElementSibling){ card.el.previousElementSibling.before(card.el); saveDockOrder(); }
    if(a === "down" && card.el.nextElementSibling){ card.el.nextElementSibling.after(card.el); saveDockOrder(); }
    if(a === "min"){ card.el.classList.toggle("min"); paintToolHead(card); }
    if(a === "move"){ if(docked) floatTool(card); else dockTool(card.id); }
    if(a === "close") closeTool(card);
  });
}
function placeFloating(card, x, y){
  card.mode = "floating"; card.el.classList.add("floating");
  card.el.style.left = (x ?? Math.min(innerWidth - 360, 380 + (toolN % 6) * 32)) + "px";
  card.el.style.top = (y ?? 60 + (toolN % 6) * 32) + "px"; toolN++;
  card.el.style.zIndex = ++toolZ; document.body.appendChild(card.el); paintToolHead(card);
}
function floatTool(card){
  const r = card.el.getBoundingClientRect();
  placeFloating(card, Math.min(innerWidth - 360, r.right + 20), Math.max(10, r.top));
  saveDockOrder(); dockEmpty();
}
// open a tool as a floating window (from the home page, or a tool already open somewhere)
function openTool(id){
  const card = liveTools.get(id) || makeTool(id); if(!card) return;
  if(card.mode === "floating"){ card.el.style.zIndex = ++toolZ; return; }
  if(card.mode === "docked" && isPresenting()){ card.el.scrollIntoView({block:"nearest", behavior:"smooth"}); return; }
  placeFloating(card); saveDockOrder(); dockEmpty();
}
function dockTool(id, quiet){
  const card = liveTools.get(id) || makeTool(id); if(!card) return;
  card.mode = "docked"; card.el.classList.remove("floating"); card.el.style.cssText = "";
  if(card.el.parentNode !== $("dock")) $("dock").appendChild(card.el);
  paintToolHead(card); saveDockOrder(); dockEmpty();
  if(!quiet) card.el.scrollIntoView({block:"nearest", behavior:"smooth"});
}

    };
    rec.onerror = e => {
      if(e.error === "not-allowed" || e.error === "service-not-allowed"){ msg("The microphone is blocked. Allow it from the address bar, then press Start again."); stop(); }
      else if(e.error === "network"){ msg("Captions need the internet. Check the connection and press Start again."); stop(); }
    };
    rec.onend = () => { if(on) setTimeout(() => { try{ rec && rec.start(); }catch(e){} }, 250); };    // the browser stops after a pause; keep going
    try{ rec.start(); }catch(e){}
    on = true; q("[data-go]").textContent = "■ Stop"; translator();
  }
  function stop(){ on = false; if(rec){ rec.onend = null; try{ rec.stop(); }catch(e){} rec = null; } q("[data-go]").textContent = "🎤 Start"; if(interimEl) interimEl.remove(); }
  q("[data-go]").onclick = () => on ? stop() : start();
  q("[data-clear]").onclick = () => { box.innerHTML = ""; };
  q("[data-from]").onchange = e => { S.from = e.target.value; save(); tr = null; if(on){ stop(); start(); } };
  q("[data-to]").onchange = e => { S.to = e.target.value; save(); tr = null; if(on) translator(); };
  b.querySelectorAll("[data-sz]").forEach(x => x.onclick = () => { S.size = Math.max(.6, Math.min(2.4, Math.round((S.size + x.dataset.sz * .15) * 100) / 100)); save(); box.style.setProperty("--s", S.size); });
  return {close: stop};
}

// ---------- learning target: today's "I can" and how students know they've got it ----------
function toolTarget(b){
  const S = toolState("target", {subject:"Math", ican:"I can add two-digit numbers by making a ten.", criteria:["I can show my thinking with a drawing or numbers","I can explain my answer to a partner"]});
  function view(){
    b.innerHTML = `<div class="tgt">${S.subject ? `<span class="subj">${esc(S.subject)}</span>` : ""}<div class="ican">${esc(S.ican || "I can …")}</div>
      ${S.criteria.filter(Boolean).length ? `<b style="font-size:14px;color:var(--muted)">I'll know I've got it when…</b><ul>${S.criteria.filter(Boolean).map(c => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}</div>
      <div class="row"><button class="chip" data-edit>✎ Change</button></div>`;
    b.querySelector("[data-edit]").onclick = edit;
  }
  function edit(){
    b.innerHTML = `<span class="lab">Subject</span><input class="full" data-s placeholder="Math, Reading, Science…">
      <span class="lab">Learning target</span><textarea class="full" data-i placeholder="I can …"></textarea>
      <span class="lab">Success criteria (one per line)</span><textarea class="full" data-c placeholder="I can …"></textarea>
      <div class="row"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Save</button></div>`;
    const q = s => b.querySelector(s);
    q("[data-s]").value = S.subject; q("[data-i]").value = S.ican; q("[data-c]").value = S.criteria.join("\n");
    q("[data-x]").onclick = view;
    q("[data-ok]").onclick = () => {
      S.subject = q("[data-s]").value.trim(); S.ican = q("[data-i]").value.trim();
      S.criteria = q("[data-c]").value.split("\n").map(x => x.trim()).filter(Boolean); save(); view();
    };
    q("[data-i]").focus();
  }
  view();
}

// ---------- brain breaks: pick a quick activity, with a built-in countdown ----------
const BREAKS = {
  Move:[["🦘","Kangaroo hops","Hop in place 15 times, then freeze like a statue."],["🏃","Run in place","Run on the spot as fast as you can for 20 seconds."],["🙆","Reach for the sky","Stretch up high, then touch your toes. Do it 5 times slowly."],["🦩","Flamingo balance","Stand on one foot and count to 15. Switch feet."],["🤖","Robot dance","Move like a robot for 30 seconds. No talking, just beeps!"],["🪑","Chair push-ups","Hands on your desk, lean in and push back 10 times."],["🌀","Arm circles","10 small circles forward, 10 big circles backward."],["🐻","Bear walk","Walk around your desk on hands and feet, slowly."]],
  Calm:[["🌬️","Balloon breaths","Breathe in for 4 like filling a balloon, out for 4 letting it go. Five times."],["🖐️","Finger breathing","Trace your hand: breathe in going up a finger, out going down."],["👀","5-4-3-2-1","Find 5 things you see, 4 you hear, 3 you can touch, 2 you smell, 1 you taste."],["🐢","Turtle time","Curl up small, count to 10 quietly, then slowly come out of your shell."],["🧘","Mountain pose","Stand tall and still like a mountain. Feel your feet on the floor for 30 seconds."],["☁️","Cloud watching","Close your eyes and picture a cloud. What shape is it? Share with a partner after."]],
  Silly:[["🙃","Opposite day","Teacher says a move, everyone does the opposite!"],["🐓","Animal sounds","Teacher names an animal; everyone acts it out without sound."],["🤪","Silly faces","Make the silliest face you can for 5 seconds. Freeze! Now another one."],["🎤","Air band","Pick an air instrument and play along to an imaginary song for 30 seconds."],["🧊","Freeze dance","Dance until the teacher says freeze. Anyone who moves sits down."],["🔤","Spell it out","Spell a word with your whole body, one letter at a time."]]
};
function toolBrainBreak(b){
  const COLS = {Move:"#d0632b", Calm:"#3b86a8", Silly:"#7550c2"};
  let cat = "All", cur = null, iv = null, left = 0;
  b.innerHTML = `<div class="row" style="margin:0 0 8px">${["All", ...Object.keys(BREAKS)].map(c => `<button class="chip" data-cat="${c}">${c}</button>`).join("")}</div>
    <div class="bbCard" data-card></div>
    <div class="row"><button class="btn primary" data-pick>🎲 Pick a break</button></div>
    <div class="row"><span data-t class="big" style="font-size:28px;min-width:70px"></span>${[1,2,3].map(m => `<button class="chip" data-go="${m}">${m} min</button>`).join("")}</div>`;
  const q = s => b.querySelector(s);
  const pool = () => cat === "All" ? Object.entries(BREAKS).flatMap(([k, v]) => v.map(x => [k, ...x])) : BREAKS[cat].map(x => [cat, ...x]);
  function show(){
    const c = q("[data-card]");
    if(!cur){ c.style.background = "#55627f"; c.innerHTML = `<div class="em">🤸</div><b>Time for a brain break?</b><small>Pick a category, then press Pick a break.</small>`; return; }
    c.style.background = COLS[cur[0]]; c.innerHTML = `<div class="em">${cur[1]}</div><b>${esc(cur[2])}</b><small>${esc(cur[3])}</small>`;
  }
  b.querySelectorAll("[data-cat]").forEach(x => x.onclick = () => { cat = x.dataset.cat; b.querySelectorAll("[data-cat]").forEach(y => y.style.outline = y === x ? "2px solid var(--ink)" : ""); });
  b.querySelector('[data-cat="All"]').style.outline = "2px solid var(--ink)";
  q("[data-pick]").onclick = () => { const p = pool().filter(x => !cur || x[2] !== cur[2]); cur = p[Math.floor(Math.random() * p.length)]; show(); };
  const stopT = () => { clearInterval(iv); iv = null; };
  b.querySelectorAll("[data-go]").forEach(x => x.onclick = () => {
    stopT(); left = x.dataset.go * 60; q("[data-t]").textContent = fmt(left);
    iv = setInterval(() => { left--; q("[data-t]").textContent = left > 0 ? fmt(left) : "Done!"; if(left <= 0){ stopT(); beep(2); } }, 1000);
  });
  show();
  return {close: stopT};
}
